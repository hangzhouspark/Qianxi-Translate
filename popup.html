<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qianxi-Translate</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="brand-row">
        <div class="brand">
          <img src="icons/icon-48.png" alt="" width="38" height="38" />
          <div>
            <h1>Qianxi-Translate</h1>
            <p>读懂网页，保持专注</p>
          </div>
        </div>
        <button id="openOptions" class="icon-button" type="button" title="打开设置" aria-label="打开设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>

      <section class="language-panel" aria-label="翻译语言">
        <label>
          <span>原文</span>
          <select id="sourceLang"></select>
        </label>
        <span class="language-arrow" aria-hidden="true">→</span>
        <label>
          <span>译文</span>
          <select id="targetLang"></select>
        </label>
      </section>

      <label class="field-block">
        <span>翻译服务</span>
        <select id="provider"></select>
      </label>

      <section class="feature-row" aria-label="翻译功能">
        <button id="togglePage" class="feature-tile page-tile" type="button">
          <span class="tile-icon tile-page" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="M10 4v4M2 8h20M6 4v4" /></svg>
          </span>
          <span class="tile-footer">
            <strong id="pageButtonTitle">整页翻译</strong>
          </span>
        </button>
        <button id="selectionToggle" class="feature-tile" type="button" aria-pressed="false">
          <span class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 4h1a3 3 0 0 1 3 3 3 3 0 0 1 3-3h1M13 20h-1a3 3 0 0 1-3-3 3 3 0 0 1-3 3H5M5 16H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1M13 8h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-7M9 7v10" /></svg>
          </span>
          <span class="tile-footer">
            <strong>划词翻译</strong>
            <span class="tile-switch" aria-hidden="true"></span>
          </span>
        </button>
        <button id="imageToggle" class="feature-tile" type="button" aria-pressed="false">
          <span class="tile-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></svg>
          </span>
          <span class="tile-footer">
            <strong>图片翻译</strong>
            <span id="imageControl" class="tile-download" aria-hidden="true"></span>
          </span>
        </button>
      </section>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    </main>
  </body>
</html>
